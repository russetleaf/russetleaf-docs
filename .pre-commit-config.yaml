# Pre-commit hooks for russetleaf-docs: the same checks as CI, run on each commit.
# Install once per clone with: pre-commit install
# The tools come from scripts/workstation/setup-ubuntu.sh, so the hooks are "system"
# hooks: nothing is downloaded. Vale needs its style package once per clone: vale sync.
repos:
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck -x
        language: system
        types: [shell]
      - id: shfmt
        name: shfmt (bash script standard layout)
        entry: shfmt -d -i 2 -ci
        language: system
        types: [shell]
      - id: bash-style
        name: bash script standard (docs/standards/bash.md)
        entry: python3 tools/check_bash_style.py
        language: system
        types: [shell]
      - id: doc-links
        name: ADR and document references are links
        entry: python3 tools/check_doc_links.py
        language: system
        files: \.md$
      - id: doc-style
        name: writing style (no second person or contractions; sentence-case headings)
        entry: python3 tools/check_doc_style.py
        language: system
        files: \.md$
      - id: vale
        name: prose style (Vale; docs/standards/documentation.md)
        entry: vale --output=line
        language: system
        files: \.md$
