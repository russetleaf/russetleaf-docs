# Vale: the prose checks of the documentation style guide (docs/standards/documentation.md).
# Only error-level rules are reported, and every reported rule fails pre-commit and CI.
# Run `vale sync` once per clone to download the pinned Google package into .vale/styles/.
StylesPath = .vale/styles
MinAlertLevel = error
Vocab = RussetLeaf
Packages = https://github.com/errata-ai/Google/releases/download/v0.7.1/Google.zip

[*.md]
BasedOnStyles = Vale, Google
# Quoted text (commands, UI messages, sample prompts) stays verbatim, as in tools/check_doc_style.py.
TokenIgnores = (US East \(N\. Virginia\)), ("[^"\n]*"), (“[^”\n]*”), (\b\d+B\b), (\b\d+(st|nd|rd|th)[- ]percentile\b), (My Profile)

# Rules raised to errors: the guide enforces them.
Google.Headings = NO
Google.We = error
Google.FirstPerson = error
Google.Will = error
Google.Ellipses = error
Google.Exclamation = error
Google.HeadingPunctuation = error
Google.OptionalPlurals = error
Google.Slang = error
Google.AMPM = error
Google.Gender = error
Google.GenderBias = error

# Rules turned off, each a deliberate difference from Google's guide (see the style guide's
# "Differences from the Google guide"):
Google.Contractions = NO
Google.Colons = NO
Google.OxfordComma = NO
Google.Quotes = NO
Google.LyHyphens = NO
Google.WordList = NO
Google.WordListCase = NO
