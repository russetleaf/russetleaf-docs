name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Lint Markdown (markdownlint)
        uses: DavidAnson/markdownlint-cli2-action@db43aef879112c3119a410d69f66701e0d530809 # v17.0.0
        with:
          config: .markdownlint-cli2.yaml
          globs: "**/*.md"
      - name: Check that ADR and document references are links
        run: python3 tools/check_doc_links.py
      - name: Check the writing style (no second person or contractions; sentence-case headings)
        run: python3 tools/check_doc_style.py
      - name: Install Vale (the same version as scripts/workstation/setup-ubuntu.sh)
        env:
          VALE_VERSION: "3.25.1"
          VALE_SHA256: "4bf5c5176b682b1da0830f471584d3494f1c2e27ee3029e1ad6f6661d4962182"
        run: |
          archive="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "${RUNNER_TEMP}/${archive}" "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/${archive}"
          echo "${VALE_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" vale
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Check the prose style (Vale)
        run: |
          vale sync
          vale --output=line $(git ls-files '*.md')
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install Zensical
        run: pip install -r requirements-docs.txt
      - name: "Build (strict mode: broken links and anchors fail)"
        run: zensical build --strict
      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
