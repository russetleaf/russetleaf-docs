# Mirrors main to the repo's private GitLab project in the russetleaf group.
# Setup: docs/phase-1-russetleaf-dev/setup/gitlab-group.md
# Secrets: GITLAB_URL (https://gitlab.com/russetleaf/<repo>.git), GITLAB_USERNAME,
# GITLAB_PAT (a fine-grained personal access token named after the repo,
# limited to the mirror project with Repository > Code: Push, expiring after one year).

name: "Backup to GitLab"

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for running manually"
        required: false
        type: string
         
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: "Run gitlab-sync"
        uses: kujov/gitlab-sync@311f54eeafe287d1e336b226fbf59e2a0217302e # main as of 2026-11-03
        with:         
          gitlab_url: ${{ secrets.GITLAB_URL }}
          username: ${{ secrets.GITLAB_USERNAME }}
          gitlab_pat: ${{ secrets.GITLAB_PAT }}
